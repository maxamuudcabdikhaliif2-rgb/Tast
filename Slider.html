
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tast  Slider</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">

    <link rel="stylesheet" href="./Slider.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">
        <div class="slider-wrapper swiper">

            <div class="card-list swiper-wrapper">

                <div class="card-item swiper-slide">
                    <img src="./assats/haadi.jpeg"
                        alt="Ahmed Abdikhalif" class="user-image">

                    <h2 class="user-name">Ahmed Abdikhalif</h2>
                    <p class="user-profession">Head of Technology</p>
                    <button class="message-button">Message</button>
                </div>

                <div class="card-item swiper-slide">
                    <img src="./assats/shiine.jpeg"
                        alt="Mohamud Abdikhalif" class="user-image">

                    <h2 class="user-name">Mohamud Abdikhalif</h2>
                    <p class="user-profession">Software Developer</p>
                    <button class="message-button">Message</button>
                </div>

                <div class="card-item swiper-slide">
                    <img src="./assats/fahad.jpeg"
                        alt="Fahad Yusuf" class="user-image">

                    <h2 class="user-name">Fahad Yusuf</h2>
                    <p class="user-profession">Software Developer</p>
                    <button class="message-button">Message</button>
                </div>

                <div class="card-item swiper-slide">
                    <img src="./assats/dhagta.jpeg"
                        alt="Abdiraxman Mohamed" class="user-image">

                    <h2 class="user-name">Abdiraxman Mohamed</h2>
                    <p class="user-profession">Software Developer</p>
                    <button class="message-button">Message</button>
                </div>

                <div class="card-item swiper-slide">
                    <img src="./assats/anwer.jpeg"
                        alt="Profile image" class="user-image">

                    <h2 class="user-name">Anwar Ahamed</h2>
                    <p class="user-profession">Software Developer</p>
                    <button class="message-button">Message</button>
                </div>

                <div class="  card-item swiper-slide">
                    <img src="./assats/zaki.jpeg"
                        alt="Profile image" class="user-image">

                    <h2 class="user-name">Zakariye Abukar</h2>
                    <p class="user-profession">Software Developer</p>
                    <button class="message-button">Message</button>
                </div>

            </div>

            <!-- Pagination -->
            <div class="swiper-pagination"></div>

            <!-- Navigation buttons -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="./Slider.js"></script>

</body>
</html>
